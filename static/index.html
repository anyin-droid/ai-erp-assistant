<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ERP Assistant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family: Arial, sans-serif;
    margin:40px;
}

pre{
    background:#f4f4f4;
    padding:15px;
    border-radius:8px;
    white-space:pre-wrap;
}
table{
    border-collapse:collapse;
    margin-top:15px;
    width:100%;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
}
th{
    background:#f4f4f4;
}

</style>
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- =========================Header========================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-3">
                📊 AI ERP Dashboard</n>
            </h2>
            <div id="userDiv">載入使用者...</div>
        </div>

        <button class="btn btn-danger" onclick="logout()">
        登出
        </button>
    </div>

    <!-- =========================Dashboard========================== -->

    <div class="row g-3 mb-4">

        <!-- 總查詢 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>總查詢次數</h5>
                    <h2 id="totalQueries">0</h2>
                </div>
            </div>
        </div>

        <!-- 今日查詢 -->

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>今日查詢</h5>
                    <h2 id="todayQueries">0</h2>
                </div>
            </div>
        </div>

        <!-- 熱門查詢 -->

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">

                    <h5>熱門查詢</h5>

                    <p id="popularQuery" class="mt-3">
                        -
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================AI 查詢========================== -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3>
                🤖 AI 查詢
            </h3>
            <input
                id="question"
                class="form-control"
                type="text"
                placeholder="請輸入查詢需求">

            <div class="mt-3">
                <button
                    class="btn btn-primary"
                    onclick="askAI()">

                    查詢

                </button>
                <button
                    class="btn btn-secondary"
                    onclick="loadLogs()">

                    查看查詢紀錄

                </button>

            </div>

        </div>

    </div>

    <!-- =========================查詢結果========================== -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3>
                📄 查詢結果
            </h3>
            <div id="result">

                請輸入自然語言開始查詢。

            </div>
        </div>
    </div>

    <!-- =========================最近五筆查詢========================== -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3>
                🕒 最近五筆查詢
            </h3>
            <div id="recentDiv">

                載入中...

            </div>
        </div>
    </div>

    <!-- =========================查詢紀錄========================== -->

    <div class="card shadow-sm">
        <div class="card-body">
            <h3>
                📚 查詢紀錄
            </h3>

            <div id="logsDiv">

            </div>
        </div>
    </div>
</div>
<hr>
<div class="text-center text-muted mt-5 mb-3">
AI ERP Assistant
<br>
Python ・ FastAPI ・ SQLite ・ OpenAI ・ Bootstrap
</div>

<script>

// =========================
// AI 查詢
// =========================
async function askAI(){

    const question = document.getElementById("question").value;
    const resultDiv = document.getElementById("result");
    const username = localStorage.getItem("username");

    resultDiv.innerHTML = `
    <div class="text-center">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">
            AI 查詢中...
        </p>

    </div>
    `;

    try{

        const response = await fetch("/ask",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                question: question,
                username: username
            })
        });

        const data = await response.json();

        if(data.error){
            resultDiv.innerHTML = `
                <h3>錯誤</h3>
                <p>${data.error}</p>
            `;
            return;
        }

        let html = `
            <h3>AI 產生的 SQL</h3>
            <pre>${data.sql}</pre>
        `;

        if(data.result && data.result.length > 0){

            html += "<h3>查詢結果</h3>";
            html += '<table class="table table-striped table-hover">';

            html += "<tr>";
            Object.keys(data.result[0]).forEach(key=>{
                html += `<th>${key}</th>`;
            });
            html += "</tr>";

            data.result.forEach(row=>{
                html += "<tr>";
                Object.values(row).forEach(value=>{
                    html += `<td>${value}</td>`;
                });
                html += "</tr>";
            });

            html += "</table>";

        }else{
            html += `<div class="alert alert-warning">

            沒有符合條件的資料。

            </div>`;
        }
        html =`<div class="alert alert-success">

        ✅ 查詢完成

        共找到 ${data.result.length} 筆資料

        </div>`+ html;

        resultDiv.innerHTML = html;

    }catch(error){

        console.error(error);

        resultDiv.innerHTML = `
            <h3>發生錯誤</h3>
            <p>${error}</p>
        `;
    }
}

// =========================
// 查詢紀錄
// =========================
async function loadLogs(){

    const response = await fetch("/logs");
    const data = await response.json();

    let html = `
        <h2>查詢紀錄</h2>
        <table class="table table-striped table-hover">
        <tr>
            <th>ID</th>
            <th>問題</th>
            <th>SQL</th>
            <th>時間</th>
        </tr>
    `;

    data.logs.forEach(log=>{
        html += `
            <tr>
                <td>${log.id}</td>
                <td>
                    ${log.question}

                    <button
                        onclick="reuseQuestion('${log.question}')"
                        class="btn btn-sm btn-outline-primary ms-2">
                        帶入查詢
                    </button>
                </td>
                <td>${log.sql_text}</td>
                <td>${log.created_at}</td>
            </tr>
        `;
    });

    html += "</table>";

    document.getElementById("logsDiv").innerHTML = html;
}

// =========================
// Dashboard
// =========================
async function loadStats(){

    const response = await fetch("/stats");
    const data = await response.json();

    document.getElementById(
        "totalQueries"
    ).innerHTML =
        data.total_queries;

    document.getElementById(
        "todayQueries"
    ).innerHTML =
        data.today_queries;

    document.getElementById(
        "popularQuery"
    ).innerHTML =
        data.popular_question;
}

// =========================
// 最近查詢
// =========================
async function loadRecent(){

    const response = await fetch("/recent");
    const data = await response.json();
    let html = '<ul class="list-group">';

    data.recent.forEach(item=>{

        html += `
            <li
                class="list-group-item list-group-item-action"
                style="cursor:pointer"
                onclick="reuseQuestion('${item.question}')"
            >
                ${item.question}
            </li>
        `;

    });

    html += "</ul>";

    document.getElementById("recentDiv").innerHTML = html;
}

// =========================
// 使用者資訊
// =========================
function loadCurrentUser(){

    const username = localStorage.getItem("username");
    const role = localStorage.getItem("role");

    let badge = "";

    if(role == "Admin"){

        badge = `<span class="badge bg-danger">Admin</span>`;

    }else if(role == "Sales"){

        badge = `<span class="badge bg-success">Sales</span>`;

    }else{

        badge = `<span class="badge bg-primary">Purchase</span>`;

    }

    document.getElementById("userDiv").innerHTML = `
        <h5 class="mb-1">
            👤 ${username}
        </h5>

        <p class="mb-2">
            ${badge}
        </p>

        <small class="text-muted">
            AI ERP Demo Environment
        </small>
    `;
    document.getElementById(
    "currentRole"
    ).innerHTML = role;
}

const username = localStorage.getItem("username");

if(!username){
    window.location.href = "/login";
}


function logout(){

    localStorage.removeItem("username");
    localStorage.removeItem("role");

    window.location.href = "/login";

}

// =========================
// 初始化
// =========================
async function init(){
    await loadStats();
    await loadRecent();
    await loadCurrentUser();
}

//案enter搜尋
document
.getElementById("question")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        askAI();

    }

});

init();

function reuseQuestion(question){

        document.getElementById(
            "question"
        ).value = question;

}
</script>

</body>
</html>
