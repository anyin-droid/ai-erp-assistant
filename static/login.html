<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>AI ERP Login</title>
</head>

<body>

    <h1>AI ERP Assistant</h1>

    <h2>登入</h2>

    <input
        id="username"
        placeholder="請輸入使用者名稱"
    >

    <button onclick="login()">
        登入
    </button>

    <script>

    async function login(){

        const username =
            document.getElementById("username").value

        if(username == ""){

            alert("請輸入使用者名稱")
            return

        }

        const response = await fetch("/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username:username
            })

        })

        const data = await response.json()

        if(data.success){

            localStorage.setItem(
                "username",
                data.username
            )

            localStorage.setItem(
                "role",
                data.role
            )

            window.location.href="/"

        }else{

            alert(data.message)

        }

    }

    </script>

</body>

</html>
